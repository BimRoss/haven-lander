server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate — single-page static site, no point caching stale HTML
    add_header Cache-Control "no-cache, must-revalidate" always;
    etag on;

    location / {
        try_files $uri $uri/ =404;
    }
}
